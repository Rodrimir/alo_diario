# Perfil de testes. O datasource vem do Testcontainers (@ServiceConnection).
spring:
  main:
    banner-mode: off

logging:
  level:
    root: WARN
    br.com.cuida: INFO
    org.flywaydb: WARN

app:
  security:
    jwt:
      secret: segredo-de-teste-com-pelo-menos-32-bytes-0123456789
  bootstrap:
    admin:
      email: admin@teste.local
      password: admin-de-teste-123
  jobs:
    # Os testes chamam os jobs diretamente, com o instante que quiserem.
    enabled: false
  voice:
    mock:
      delay: PT0S
  webhook:
    vapi:
      secret: segredo-do-webhook-de-teste
  storage:
    provider: filesystem
    filesystem:
      directory: target/test-recordings
    download:
      allow-classpath: true
  cors:
    allowed-origins: http://localhost:3000
