# Configuração comum a todos os perfis. Valores sensíveis vêm SEMPRE de variáveis de ambiente.
# Perfis: dev (padrão, adaptadores mock), test (Testcontainers), prod (provedores reais).
spring:
  application:
    name: cuida-backend
  profiles:
    default: dev
  config:
    # Permite usar um arquivo .env local (não versionado) no formato CHAVE=valor.
    import: optional:file:.env[.properties]

  # URL/usuário/senha são definidos por perfil (dev: defaults locais; prod: obrigatórios;
  # test: Testcontainers).
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  modulith:
    events:
      # Publicações pendentes (listener falhou / app caiu) são reenviadas na inicialização.
      republish-outstanding-events-on-restart: true
      jdbc:
        # A tabela event_publication é criada pelo Flyway (V1).
        schema-initialization:
          enabled: false

  # Executor dos listeners assíncronos (pipeline pós-ligação). Limitado de propósito.
  task:
    execution:
      thread-name-prefix: pipeline-
      pool:
        core-size: ${APP_PIPELINE_THREADS:4}
        max-size: ${APP_PIPELINE_THREADS:4}
        queue-capacity: 1000
      shutdown:
        await-termination: true
        await-termination-period: PT30S

  web:
    locale: pt_BR
    locale-resolver: fixed

  threads:
    virtual:
      enabled: false

springdoc:
  # Desligado por padrão (inclusive em produção); o perfil dev liga com SWAGGER_ENABLED=true.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    persist-authorization: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:PT1H}
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    # Origens do frontend, separadas por vírgula (ex.: https://app.alodiario.com.br). Vazio = nenhuma.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  jobs:
    # Liga/desliga todos os jobs agendados (agendador de ligações, retentativas, limpezas).
    enabled: ${APP_JOBS_ENABLED:true}
  calls:
    recovery-window: ${APP_CALLS_RECOVERY_WINDOW:PT2H}
    stuck-after: ${APP_CALLS_STUCK_AFTER:PT30M}
    max-duration-seconds: ${APP_CALLS_MAX_DURATION_SECONDS:600}
    product-name: ${APP_PRODUCT_NAME:Alô Diário}
  voice:
    # mock (padrão: simula a ligação e os webhooks) | vapi
    provider: ${APP_VOICE_PROVIDER:mock}
    mock:
      delay: ${APP_VOICE_MOCK_DELAY:PT3S}
    vapi:
      api-key: ${VAPI_API_KEY:}
      phone-number-id: ${VAPI_PHONE_NUMBER_ID:}
      webhook-base-url: ${VAPI_WEBHOOK_BASE_URL:}
      webhook-secret: ${VAPI_WEBHOOK_SECRET:}
      model:
        provider: ${VAPI_MODEL_PROVIDER:openai}
        model: ${VAPI_MODEL:gpt-4o}
      voice:
        provider: ${VAPI_VOICE_PROVIDER:azure}
        voice-id: ${VAPI_VOICE_ID:pt-BR-FranciscaNeural}
      transcriber:
        provider: ${VAPI_TRANSCRIBER_PROVIDER:deepgram}
        model: ${VAPI_TRANSCRIBER_MODEL:nova-2}
        language: ${VAPI_TRANSCRIBER_LANGUAGE:pt-BR}
  webhook:
    vapi:
      # Segredo enviado pelo Vapi em assistant.server.headers. Vazio = webhook recusado.
      secret: ${VAPI_WEBHOOK_SECRET:}
  storage:
    # s3 (MinIO/AWS) | filesystem (pasta local)
    provider: ${APP_STORAGE_PROVIDER:s3}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:cuida-recordings}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
    filesystem:
      directory: ${APP_STORAGE_DIRECTORY:./data/recordings}
    download:
      # A URL da gravação vem do webhook: só HTTPS destes hosts (proteção contra SSRF).
      allowed-hosts: ${APP_RECORDING_ALLOWED_HOSTS:storage.vapi.ai,*.vapi.ai}
      # classpath: só faz sentido com o gateway mock (gravação de exemplo).
      allow-classpath: ${APP_RECORDING_ALLOW_CLASSPATH:false}
  notifications:
    # mock (padrão: só registra no log) | whatsapi (envia pelo whats-api da equipe)
    provider: ${NOTIFICATIONS_PROVIDER:mock}
    whatsapi:
      base-url: ${WHATSAPI_BASE_URL:}
      # api_key da empresa no whats-api (resolve o número de origem).
      api-key: ${WHATSAPI_API_KEY:}
      language-code: ${WHATSAPI_LANGUAGE_CODE:pt_BR}
    templates:
      resumo: ${WHATSAPI_TEMPLATE_RESUMO:alo_diario_resumo}
      sem-contato: ${WHATSAPI_TEMPLATE_SEM_CONTATO:alo_diario_sem_contato}
      alerta: ${WHATSAPI_TEMPLATE_ALERTA:alo_diario_alerta}
  retention:
    audio-days: ${APP_RETENTION_AUDIO_DAYS:90}
    webhook-payload-days: ${APP_RETENTION_WEBHOOK_PAYLOAD_DAYS:7}
  ai:
    # mock (padrão, sem chave) | openai
    provider: ${APP_AI_PROVIDER:mock}
    # PROVIDER = usa a transcrição do gateway de voz; WHISPER = transcreve o áudio com a OpenAI.
    transcription-mode: ${APP_TRANSCRIPTION_MODE:PROVIDER}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat-model: ${OPENAI_CHAT_MODEL:}
      transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    br.com.cuida: INFO
