# Configuração comum a todos os perfis. Valores sensíveis vêm SEMPRE de variáveis de ambiente.
# Perfis: dev (padrão, adaptadores mock), test (Testcontainers), prod (provedores reais).
spring:
  application:
    name: cuida-backend
  profiles:
    default: dev
  config:
    # Permite usar um arquivo .env local (não versionado) no formato CHAVE=valor.
    import: optional:file:.env[.properties]

  # URL/usuário/senha são definidos por perfil (dev: defaults locais; prod: obrigatórios;
  # test: Testcontainers).
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  modulith:
    events:
      # Publicações pendentes (listener falhou / app caiu) são reenviadas na inicialização.
      republish-outstanding-events-on-restart: true
      jdbc:
        # A tabela event_publication é criada pelo Flyway (V1).
        schema-initialization:
          enabled: false

  # Executor dos listeners assíncronos (pipeline pós-ligação). Limitado de propósito.
  task:
    execution:
      thread-name-prefix: pipeline-
      pool:
        core-size: ${APP_PIPELINE_THREADS:4}
        max-size: ${APP_PIPELINE_THREADS:4}
        queue-capacity: 1000
      shutdown:
        await-termination: true
        await-termination-period: PT30S

  web:
    locale: pt_BR
    locale-resolver: fixed

  threads:
    virtual:
      enabled: false

springdoc:
  # Desligado por padrão (inclusive em produção); o perfil dev liga com SWAGGER_ENABLED=true.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    persist-authorization: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:PT1H}
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  jobs:
    # Liga/desliga todos os jobs agendados (agendador de ligações, retentativas, limpezas).
    enabled: ${APP_JOBS_ENABLED:true}
  calls:
    recovery-window: ${APP_CALLS_RECOVERY_WINDOW:PT2H}
    stuck-after: ${APP_CALLS_STUCK_AFTER:PT30M}
    max-duration-seconds: ${APP_CALLS_MAX_DURATION_SECONDS:600}
    assistant-name: ${APP_ASSISTANT_NAME:Cuida}
  voice:
    # mock (padrão: simula a ligação e os webhooks) | vapi
    provider: ${APP_VOICE_PROVIDER:mock}
    mock:
      delay: ${APP_VOICE_MOCK_DELAY:PT3S}
  webhook:
    vapi:
      # Segredo enviado pelo Vapi em assistant.server.headers. Vazio = webhook recusado.
      secret: ${VAPI_WEBHOOK_SECRET:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    br.com.cuida: INFO
