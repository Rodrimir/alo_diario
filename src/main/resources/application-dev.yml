# Perfil de desenvolvimento local: roda de ponta a ponta sem nenhuma chave externa.
# Os valores padrão abaixo apontam para os serviços do docker-compose.yml (credenciais locais, não
# são segredos). Sobrescreva via .env ou variáveis de ambiente.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:cuida}}
    username: ${DB_USERNAME:cuida}
    password: ${DB_PASSWORD:cuida}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  security:
    jwt:
      # Sem JWT_SECRET, gera um segredo aleatório a cada inicialização (só no dev).
      allow-random-secret: true
  bootstrap:
    admin:
      # Administrador semeado no dev (credenciais locais, não são segredo).
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@cuida.local}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    br.com.cuida: DEBUG
